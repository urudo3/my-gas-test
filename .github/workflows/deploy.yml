name: Manual Deploy to Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_files:
        description: '転送対象（カンマ区切りで複数指定可）'
        required: true
        default: '*.html, *.js, *.css' # ご希望の初期値

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      # 入力された拡張子に一致するファイルだけを一時フォルダに集める処理
      - name: Filter and Collect Files
        run: |
          mkdir dist
          # 入力された文字列（*.html, *.js, *.css）をカンマで分解してコピー
          IFS=',' read -ra ADDR <<< "${{ github.event.inputs.target_files }}"
          for i in "${ADDR[@]}"; do
            # 空白を除去してからコピーを実行
            pattern=$(echo $i | xargs)
            cp $pattern dist/ 2>/dev/null || echo "No files found for $pattern"
          done

      - name: Push to Production Repo
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.MY_PAT }}
          repository-name: あなたのユーザー名/my-gas-assets
          branch: main
          folder: dist # 抽出したファイルが入っているフォルダだけを送る
          clean: false # 本番にある他のファイルを消さない設定
