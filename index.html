<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>貸借記録メモ Pro (GitHub Edition)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="loan-memo.css">
</head>

<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="container">
        <div class="nav">
            <button class="nav-item active" onclick="switchNav(0)">入力</button>
            <button class="nav-item" onclick="switchNav(1)">未完済</button>
            <button class="nav-item" onclick="switchNav(2)">履歴</button>
            <button class="nav-item" onclick="switchNav(3)">分析</button>
        </div>

        <div id="viewport">
            <!-- 1: 入力 -->
            <div class="page">
                <div class="card">
                    <label>取引タイプ</label>
                    <div class="toggle-group">
                        <button class="toggle-btn active" id="btn_kashi" onclick="setType('貸した')">貸した</button>
                        <button class="toggle-btn" id="btn_kaeri" onclick="setType('返ってきた')">返ってきた</button>
                    </div>

                    <label>発生日</label>
                    <input type="date" id="date">

                    <label id="label_amt">金額</label>
                    <input type="number" id="amount" placeholder="0" inputmode="numeric" oninput="handleAmountInput()">

                    <div id="repayment_section" style="display:none;">
                        <label>対象を選択</label>
                        <div id="suggest_list" class="suggest-list"></div>
                    </div>

                    <label>内容</label>
                    <input type="text" id="title" placeholder="ランチ、交通費など">

                    <label>メモ</label>
                    <textarea id="note" placeholder="詳細メモ（任意）"></textarea>

                    <button class="btn-main" id="btn_submit" onclick="submitData()">記録を保存する</button>
                    <div id="status_msg"
                        style="text-align:center; margin-top:15px; font-size:14px; font-weight:600; min-height:1.2em;">
                    </div>
                </div>

                <div class="sum-grid">
                    <div class="sum-card">
                        <div class="sum-label">貸し総額</div>
                        <div class="sum-val" id="sum_kashi">---</div>
                    </div>
                    <div class="sum-card">
                        <div class="sum-label">返却済み</div>
                        <div class="sum-val" id="sum_kaeri">---</div>
                    </div>
                    <div class="sum-card sum-balance">
                        <div class="sum-label">未回収残高</div>
                        <div class="sum-val txt-pos" id="sum_bal">---</div>
                    </div>
                </div>
            </div>

            <!-- 2: 未完済 -->
            <div class="page">
                <h3 style="margin-top:0;">未完済リスト</h3>
                <div id="list_unpaid"></div>
            </div>

            <!-- 3: 履歴 -->
            <div class="page">
                <h3 style="margin-top:0;">最近の取引</h3>
                <div id="list_history"></div>
            </div>

            <!-- 4: 分析 -->
            <div class="page">
                <h3 style="margin-top:0;">月別サマリー</h3>
                <div id="list_monthly"></div>
            </div>
        </div>
    </div>

    <div class="lock-overlay" id="spinner">
        <div style="text-align:center;">
            <div class="spinner"></div>
            <div id="lock_msg" style="margin-top:10px; font-weight:600; color:var(--text-sub);">処理中...</div>
        </div>
    </div>

    <div class="modal" id="modal_del">
        <div class="modal-card">
            <h3 style="margin:0 0 10px 0;">取消の確認</h3>
            <p style="color:var(--text-sub); font-size:14px; line-height:1.5;">
                この記録を削除しますか？<br>返済を取り消すと、元の貸したデータの残高も自動的に復元されます。</p>
            <div class="modal-btns">
                <button class="btn-sub" onclick="closeModal()">戻る</button>
                <button class="btn-dan" id="btn_confirm_del">削除</button>
            </div>
        </div>
    </div>

    <script src="loan-memo.js"></script>
</body>

</html>
